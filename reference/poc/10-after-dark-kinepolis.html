<script>
'use strict';
const W=1900, H=700, T=6;
// =============================================================== robots
const DEFS={
  voxxy:{name:'Voxxy',r:9,accel:12,max:290,drag:9,mass:1,color:'#ff7a1a',eye:'#ffd27a',light:{c:[255,120,40],type:'cone',ang:0.38,range:280}},
  droid:{name:'Droid',r:13,accel:4,max:115,drag:7,mass:3,color:'#4a4f57',eye:'#ffc46b',tall:true,light:{c:[90,220,140],type:'pool',range:95}},
  biggy:{name:'Biggy',r:17,accel:0.6,max:235,drag:0.35,mass:7,color:'#5f7387',eye:'#ffe9b0',belly:'#d9772a',light:{c:[70,120,255],type:'cone',ang:1.0,range:300}},
};
function mkBot(kind,x,y){ return Object.assign({kind,x,y,vx:0,vy:0,face:0,anim:0,ix:0,iy:0,mounted:false,braced:false},DEFS[kind]); }
function stepBot(b,dt,walls,extra){
  if(b.mounted){ b.vx=b.vy=0; return; }
  const il=Math.hypot(b.ix,b.iy);
  if(il>0){ const tx=b.ix/il*b.max, ty=b.iy/il*b.max; const k=1-Math.exp(-b.accel*dt); b.vx+=(tx-b.vx)*k; b.vy+=(ty-b.vy)*k; }
  else { const k=Math.exp(-b.drag*dt); b.vx*=k; b.vy*=k; }
  let sp=Math.hypot(b.vx,b.vy); const cap=Math.max(b.max,b.boostCap||0); if(sp>cap){ b.vx*=cap/sp; b.vy*=cap/sp; } b.boostCap=(b.boostCap||0)*Math.exp(-1.5*dt);
  if(sp<2 && il===0){ b.vx=b.vy=0; }
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(sp>1&&(b.vx||b.vy)){ b.face=Math.atan2(b.vy,b.vx); b.anim+=sp*dt/18; }
  for(const w of walls){
    if(w.skipFor && w.skipFor(b)) continue;
    const hit=circleRect(b,w); if(!hit) continue;
    if(w.onHit && w.onHit(b,hit)) continue;
    b.x+=hit.nx*hit.pen; b.y+=hit.ny*hit.pen;
    const vn=b.vx*hit.nx+b.vy*hit.ny;
    if(vn<0){ const rest=b.kind==='biggy'?0.45:0.05; b.vx-=(1+rest)*vn*hit.nx; b.vy-=(1+rest)*vn*hit.ny; }
    if(w.why && extra && extra.onBlocked) extra.onBlocked(b,w);
  }
}
function circleRect(c,r){
  const cx=Math.max(r.x,Math.min(c.x,r.x+r.w)), cy=Math.max(r.y,Math.min(c.y,r.y+r.h));
  let dx=c.x-cx, dy=c.y-cy, d=Math.hypot(dx,dy); if(d>=c.r) return null;
  if(d<1e-6){ const l=c.x-r.x, rr=r.x+r.w-c.x, t=c.y-r.y, bb=r.y+r.h-c.y; const m=Math.min(l,rr,t,bb);
    if(m===l) return {nx:-1,ny:0,pen:l+c.r}; if(m===rr) return {nx:1,ny:0,pen:rr+c.r}; if(m===t) return {nx:0,ny:-1,pen:t+c.r}; return {nx:0,ny:1,pen:bb+c.r}; }
  return {nx:dx/d,ny:dy/d,pen:c.r-d};
}
function botsCollide(a,b,e=0.3){
  if(a.mounted||b.mounted) return null;
  const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r; if(d>=min||d<1e-6) return null;
  const nx=dx/d, ny=dy/d, pen=min-d, ma=a.braced?1e6:a.mass, mb=b.braced?1e6:b.mass, tot=ma+mb;
  a.x-=nx*pen*mb/tot; a.y-=ny*pen*mb/tot; b.x+=nx*pen*ma/tot; b.y+=ny*pen*ma/tot;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv>0) return {rv:0};
  const j=-(1+e)*rv/(1/ma+1/mb); if(!a.braced){ a.vx-=j*nx/ma; a.vy-=j*ny/ma; } if(!b.braced){ b.vx+=j*nx/mb; b.vy+=j*ny/mb; } return {rv:-rv};
}
const inRect=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
// =============================================================== light: visibility polygons (walls cast shadows; glass and low seats do not)
function rayRect(px,py,dx,dy,r){ // slab test; returns t>0 or Infinity
  let tmin=-Infinity, tmax=Infinity;
  for(const [p,d,lo,hi] of [[px,dx,r.x,r.x+r.w],[py,dy,r.y,r.y+r.h]]){
    if(Math.abs(d)<1e-9){ if(p<lo||p>hi) return Infinity; }
    else { let t1=(lo-p)/d, t2=(hi-p)/d; if(t1>t2)[t1,t2]=[t2,t1]; tmin=Math.max(tmin,t1); tmax=Math.min(tmax,t2); if(tmin>tmax) return Infinity; }
  }
  return tmax<0?Infinity:(tmin>0?tmin:0);
}
function castPoly(px,py,a0,a1,range,walls,n){
  const pts=[]; const occl=walls.filter(w=>!w.glass&&!w.low);
  for(let i=0;i<=n;i++){ const a=a0+(a1-a0)*i/n, dx=Math.cos(a), dy=Math.sin(a); let t=range;
    for(const w of occl){ const tt=rayRect(px,py,dx,dy,w); if(tt<t) t=tt; }
    pts.push({x:px+dx*t,y:py+dy*t}); }
  return pts;
}
function pointInPoly(p,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const a=poly[i], b=poly[j]; if((a.y>p.y)!==(b.y>p.y) && p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) c=!c; } return c; }
// a light source: {x,y,face,c,type,ang,range,poly,full}
function buildLights(bots,walls,mirrors){
  const lights=[];
  for(const b of bots){ const L=b.light; const src={x:b.x,y:b.y,face:b.face,c:L.c,type:L.type,ang:L.ang,range:L.range*(b.mounted?1.6:1),owner:b.kind,primary:true};
    if(b.mounted){ const carrier=bots.find(o=>o.kind==='biggy'); src.x=carrier.x; src.y=carrier.y; }
    if(src.type==='pool'){ src.poly=[{x:src.x,y:src.y},...castPoly(src.x,src.y,0,Math.PI*2,src.range,walls,72)]; src.full=true; }
    else src.poly=[{x:src.x,y:src.y},...castPoly(src.x,src.y,src.face-src.ang,src.face+src.ang,src.range,walls,48)];
    lights.push(src);
    // mirrors: the cinema screen bounces light. Sample points along the mirror lit by this source become secondary cones.
    for(const m of mirrors){ const cands=[]; for(let k=0;k<=8;k++){ const s={x:m.x0+(m.x1-m.x0)*k/8,y:m.y}; const d=dist(src,s); if(d<src.range-10 && pointInPoly({x:s.x,y:s.y+m.ny*3},src.poly)) cands.push({s,d}); }
      if(!cands.length) continue; cands.sort((a,b)=>a.d-b.d); const centre=cands[Math.floor(cands.length/2)];
      for(const cnd of [cands[0],centre,cands[cands.length-1]]){ if(!cnd) continue; const s=cnd.s; const dx=s.x-src.x, dy=s.y-src.y; const rd=Math.atan2(-dy*1,dx); // reflect about a horizontal mirror
        const sec={x:s.x,y:s.y+m.ny*4,face:rd,c:src.c,type:'cone',ang:0.55,range:Math.max(90,src.range-cnd.d),owner:src.owner,primary:false};
        sec.poly=[{x:sec.x,y:sec.y},...castPoly(sec.x,sec.y,sec.face-sec.ang,sec.face+sec.ang,sec.range,walls,32)]; lights.push(sec); }
    }
  }
  return lights;
}
const litBy=(lights,kind,p)=>lights.some(L=>L.owner===kind&&pointInPoly(p,L.poly)&&dist(L,p)<L.range);
// =============================================================== input / hud
const keys={}; addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); if(!e.repeat&&scene) scene.key(e.code);}); addEventListener('keyup',e=>keys[e.code]=false);
function readStick(){ let x=0,y=0; if(keys.KeyA||keys.ArrowLeft)x-=1; if(keys.KeyD||keys.ArrowRight)x+=1; if(keys.KeyW||keys.ArrowUp)y-=1; if(keys.KeyS||keys.ArrowDown)y+=1; return {x,y}; }
let scene=null, toast=null; window.__dbg={get scene(){return scene;},get toast(){return toast;}};
function setObjective(t,k){ document.getElementById('obj').innerHTML=t; document.getElementById('keys').textContent=k; }

// =============================================================== FIRST FLOOR — from the Devoxx plan, rotated: plan top (closed cinema section) → left, main staircase → right
// Closed section x 0..600 (unnumbered cinema rooms A–E, curved foyer, kiosk). Fire door at x=600. Devoxx rooms 3,4,5,6 bottom / 10,9,8,7 top.
// Secondary staircases: niches in the corridor walls between 3|4 and 10|9. Main staircase: corridor end, between 6 and 7.
const CY0=300, CY1=400, ROOM_D=230, DOOR=46;
const rooms=[];
(function(){ const add=(n,x,w,side,closed)=>rooms.push({n,x,w,y:side<0?CY0-ROOM_D:CY1,h:ROOM_D,side,closed:!!closed});
  add('A',70,160,-1,1); add('B',240,160,-1,1); add('C',410,160,-1,1); add('D',180,190,1,1); add('E',380,190,1,1);
  add(10,610,256,-1); add(9,906,320,-1); add(8,1234,375,-1); add(7,1617,263,-1);
  add(3,610,256,1); add(4,906,320,1); add(5,1234,375,1); add(6,1617,263,1); })();
const R=n=>rooms.find(r=>r.n===n);
function roomDoor(r){ const cx=r.x+r.w/2; return r.side<0? {x:cx-DOOR/2,y:CY0-T,w:DOOR,h:12,cx,cy:CY0,side:-1,r} : {x:cx-DOOR/2,y:CY1-T,w:DOOR,h:12,cx,cy:CY1,side:1,r}; }
const F1={fireX:600,foyer:{x:14,y:CY1,w:160,h:230},kiosk:{x:110,y:412,w:56,h:56},nicheTop:{x:866,y:CY0-60,w:40,h:60},nicheBot:{x:866,y:CY1,w:40,h:60},mainStair:{x:1830,y:CY0+6,w:64,h:CY1-CY0-12}};
function floor1Walls(){
  const w=[]; w.push({x:0,y:0,w:W,h:T},{x:0,y:H-T,w:W,h:T},{x:0,y:0,w:T,h:H},{x:W-T,y:0,w:T,h:H});
  for(const side of [-1,1]){
    const yy= side<0? CY0-T : CY1; const rs=rooms.filter(r=>r.side===side); let x=0;
    const gaps=rs.map(r=>{ const d=roomDoor(r); return [d.x,d.x+d.w]; });
    const niche= side<0? F1.nicheTop : F1.nicheBot; gaps.push([niche.x,niche.x+niche.w]);
    if(side>0) gaps.push([F1.foyer.x,F1.foyer.x+F1.foyer.w]); // the foyer opens straight onto the corridor
    gaps.sort((a,b)=>a[0]-b[0]);
    for(const [g0,g1] of gaps){ if(g0>x) w.push({x,y:yy,w:g0-x,h:T}); x=g1; } w.push({x,y:yy,w:W-x,h:T});
    for(const r of rs){ w.push({x:r.x-T,y:r.y,w:T,h:r.h},{x:r.x+r.w,y:r.y,w:T,h:r.h}); const by= side<0? r.y-T : r.y+r.h; w.push({x:r.x-T,y:by,w:r.w+2*T,h:T}); }
    w.push({x:niche.x-T,y:niche.y,w:T,h:niche.h},{x:niche.x+niche.w,y:niche.y,w:T,h:niche.h},{x:niche.x-T,y:side<0?niche.y-T:niche.y+niche.h,w:niche.w+2*T,h:T,stair:side});
  }
  const f=F1.foyer; w.push({x:f.x-T,y:f.y,w:T,h:f.h},{x:f.x+f.w,y:f.y,w:T,h:f.h},{x:f.x-T,y:f.y+f.h,w:f.w+2*T,h:T});
  const k=F1.kiosk; w.push({x:k.x,y:k.y,w:k.w,h:T,glass:true},{x:k.x,y:k.y+k.h-T,w:k.w,h:T,glass:true},{x:k.x+k.w-T,y:k.y,w:T,h:k.h,glass:true},{x:k.x,y:k.y,w:T,h:16,glass:true},{x:k.x,y:k.y+40,w:T,h:16,glass:true},{x:k.x,y:k.y+16,w:T,h:24,hidden:true,skipFor:b=>b.kind==='voxxy',why:b=>`${b.name}: the kiosk hatch is Voxxy-sized`});
  w.push({x:F1.mainStair.x+F1.mainStair.w,y:CY0,w:T,h:CY1-CY0,stair:0}); // top of the main staircase
  return w;
}
// =============================================================== GROUND FLOOR — from the Devoxx plan, rotated the same way: hall left, lobby + main staircase + entrance right
const GF={};
GF.hall={x:30,y:90,w:1010,h:600}; GF.openings=[[120,180],[240,310],[380,460],[540,610]]; // in the hall's right wall (the scalloped wall on the plan)
GF.food={court:{x:30,y:90,w:300,h:160},gaps:[[80,124],[210,254],[285,329]],soup:{x:60,y:100,w:90,h:30},shelf:{x:165,y:100,w:22,h:16},sandwich:{x:200,y:100,w:70,h:30},coffee:{x:285,y:100,w:45,h:30}};
GF.stairs=[{x:150,y:300,w:200,h:60,to:'top'},{x:150,y:430,w:200,h:60,to:'bot'}]; // secondary staircases up to the cinema corridor
GF.tech={x:30,y:560,w:170,h:130}; GF.panel={x:50,y:568,w:26,h:16}; GF.rack={x:140,y:640,w:20,h:24};
GF.store={x:900,y:90,w:140,h:110}; GF.roller={x:894,y:130,w:T,h:60}; // Devoxx polo & badge store, roller door on its hall side
GF.booths=[]; const SPONSORS=['Kube Kettle','JavaBeans & Co','Cloudy Bank','Rubber Duck Inc','Legacy Systems SA','Monolith GmbH','NullPointer Insurance','Async Airlines','Big Data Bakery','Sticker Mine','Regex Racing','The Coffee Sponsor'];
const TABLES=new Set(['2,0','1,1','1,2','0,3','0,1','2,3']);
(function(){ let k=0; for(let row=0;row<3;row++) for(let col=0;col<4;col++){ const x=400+col*160, y=250+row*140; GF.booths.push({x,y,w:100,h:70,name:SPONSORS[k++],table:TABLES.has(row+','+col),col,row}); } })();
GF.reception={x:1280,y:120,w:240,h:50}; GF.printer={x:1284,y:158,w:20,h:12};
GF.mainStair={x:1280,y:200,w:240,h:200}; GF.gate={x:1274,y:200,w:T,h:200};

GF.entrance={x:W-T,y:360,w:T,h:170};
GF.laneX=[370,530,690,850,1010]; GF.laneY=[215,355,495,645];
function groundWalls(){
  const w=[]; w.push({x:0,y:0,w:W,h:T},{x:0,y:H-T,w:W,h:T},{x:0,y:0,w:T,h:H},{x:W-T,y:0,w:T,h:H});

  const t=GF.tech; w.push({x:t.x,y:t.y-T,w:t.w+T,h:T},{x:t.x+t.w,y:t.y,w:T,h:40},{x:t.x+t.w,y:t.y+90,w:T,h:t.h-90}); // door on the right, y 600..650
  const s=GF.store; w.push({x:s.x-T,y:s.y,w:T,h:GF.roller.y-s.y},{x:s.x-T,y:GF.roller.y+GF.roller.h,w:T,h:s.y+s.h-(GF.roller.y+GF.roller.h)},{x:s.x-T,y:s.y+s.h,w:s.w+T,h:T});

// =============================================================== views (what the camera shows per chapter)
const VIEW_CLOSED={x:0,y:40,w:900,h:620}, VIEW_DEVOXX={x:590,y:40,w:1310,h:620}, VIEW_F1={x:0,y:40,w:1900,h:620}, VIEW_GROUND={x:0,y:0,w:W,h:H};
const CHAPTER_TITLES=['','1 · Night — the closed cinema section','2 · Expo — the exhibition hall','3 · Lunch — doors open','4 · Keynote — Room 8'];
function level(){
  const walls=[]; const setWalls=a=>{ walls.length=0; walls.push(...a); };
  const bots=[mkBot('voxxy',60,325),mkBot('droid',60,352),mkBot('biggy',66,380)]; let cur=0;
  const byKind=k=>bots.find(b=>b.kind===k);
  const r8=R(8), d8=roomDoor(r8);
  const TALKS={3:'Hands-on: agents that ship',4:'Java 27 in 50 minutes',5:'Kubernetes, but calmer',6:'The last talk about microservices',7:'Deep dive: virtual threads',9:'From developer to builder',10:'BOF: what broke this year'};
  const S={t:0,chapter:0,phase:'intro',floor:'up',view:VIEW_CLOSED,blockedAt:new Map(),log:[],score:{},skipped:[],swag:[],fade:0};
  // ---------------------------------------------------------------- shared helpers
  function onBlocked(b,w){ const last=S.blockedAt.get(w)||-9; if(S.t-last<2.5) return; const m=w.why(b); if(m){ flash(m); S.blockedAt.set(w,S.t); } }
  function stepAll(dt,extra){ const st=readStick(); bots.forEach((b,i)=>{ if(i===cur){ b.ix=st.x; b.iy=st.y; } else { b.ix=b.iy=0; } if(b.braced){ b.vx=b.vy=0; b.ix=b.iy=0; return; } const before={vx:b.vx,vy:b.vy}; stepBot(b,dt,walls,{onBlocked}); if(extra&&extra.afterStep) extra.afterStep(b,before); });
    const d=byKind('droid'), bg=byKind('biggy'); if(d.mounted){ d.x=bg.x; d.y=bg.y-6; d.face=bg.face; }

    update(dt){ fadeIn(dt); if(S.pause) return; if(S.phase==='cut'){ S.t+=dt; cutUpdate(dt); return; } if(S.phase!=='play') return; S.t+=dt; CH[S.chapter].update(dt); },
    draw(g){ if(S.chapter===0){ g.fillStyle='#0b0c10'; g.fillRect(0,0,W,H); return; } CH[S.chapter].draw(g);
      const v=S.view; g.fillStyle='#6b7280'; g.font='12px system-ui'; g.textAlign='right'; g.fillText(CHAPTER_TITLES[S.chapter],v.x+v.w-20,v.y+v.h-16); g.textAlign='left'; } };
}
// =============================================================== drawing helpers
function label(g,x,y,t,size,color){ g.fillStyle=color||'#e8e6e1'; g.font=`${size||11}px system-ui`; g.textAlign='center'; g.fillText(t,x,y); }
function drawBot(g,b,active){
  const t=performance.now()/1000;
  g.fillStyle='rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(b.x+(b.tall?10:4), b.y+(b.tall?8:4), b.r*(b.tall?1.5:1.1), b.r*(b.tall?1.0:0.8),0,0,7); g.fill();
  const sp=Math.hypot(b.vx,b.vy); const st=Math.sin(b.anim*6)*(sp>5?1:0);
  g.fillStyle='#222'; const fx=Math.cos(b.face+Math.PI/2)*b.r*0.55, fy=Math.sin(b.face+Math.PI/2)*b.r*0.55, ax=Math.cos(b.face)*st*b.r*0.4, ay=Math.sin(b.face)*st*b.r*0.4;
  g.beginPath(); g.arc(b.x+fx+ax,b.y+fy+ay,b.r*0.3,0,7); g.fill(); g.beginPath(); g.arc(b.x-fx-ax,b.y-fy-ay,b.r*0.3,0,7); g.fill();
  g.fillStyle=b.color; g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fill();
  if(b.belly){ g.fillStyle=b.belly; g.beginPath(); g.arc(b.x+Math.cos(b.face)*b.r*0.25,b.y+Math.sin(b.face)*b.r*0.25,b.r*0.5,0,7); g.fill(); }
  if(b.kind==='droid'){ g.strokeStyle='#8a9099'; g.lineWidth=2; g.beginPath(); g.arc(b.x,b.y,b.r*0.62,0,7); g.stroke(); g.lineWidth=1; }
  if(b.kind==='voxxy'){ g.strokeStyle='#ff9a4a'; g.lineWidth=3; for(const s of [-1,1]){ const a=b.face+s*Math.PI/2; const sw=Math.sin(b.anim*6)*s*0.5*(sp>5?1:0.15); g.beginPath(); g.moveTo(b.x+Math.cos(a)*b.r*0.8,b.y+Math.sin(a)*b.r*0.8); g.lineTo(b.x+Math.cos(a)*b.r*1.6+Math.cos(b.face)*sw*14,b.y+Math.sin(a)*b.r*1.6+Math.sin(b.face)*sw*14); g.stroke(); } g.lineWidth=1; }
  const ex=Math.cos(b.face)*b.r*0.55, ey=Math.sin(b.face)*b.r*0.55, px=Math.cos(b.face+Math.PI/2)*b.r*0.3, py=Math.sin(b.face+Math.PI/2)*b.r*0.3;
  g.fillStyle=b.eye; g.shadowColor=b.eye; g.shadowBlur=8; g.beginPath(); g.arc(b.x+ex+px,b.y+ey+py,b.r*0.16,0,7); g.arc(b.x+ex-px,b.y+ey-py,b.r*0.16,0,7); g.fill(); g.shadowBlur=0;
  if(active){ g.strokeStyle='#fff'; g.setLineDash([3,3]); g.beginPath(); g.arc(b.x,b.y,b.r+5+Math.sin(t*4)*1.5,0,7); g.stroke(); g.setLineDash([]); }
  label(g,b.x,b.y-b.r-8,b.name,10);
}
// =============================================================== loop (camera follows the chapter's view rect)
const cv=document.getElementById('c'), g=cv.getContext('2d'); let scale=1, ox=0, oy=0, view={x:0,y:0,w:W,h:H};
function resize(){ const hud=document.getElementById('hud').offsetHeight; cv.width=innerWidth; cv.height=innerHeight; view=scene?scene.view():view; scale=Math.min(innerWidth/view.w,(innerHeight-hud)/view.h); ox=(innerWidth-view.w*scale)/2-view.x*scale; oy=hud+(innerHeight-hud-view.h*scale)/2-view.y*scale; }
addEventListener('resize',resize);
function load(){ hideMsg(); scene=level(); resize(); }
let last=performance.now();
function frame(now){ const dt=Math.min(0.033,(now-last)/1000); last=now; scene.update(dt); const v=scene.view(); if(v!==view) resize();
  g.setTransform(1,0,0,1,0,0); g.fillStyle='#0b0c10'; g.fillRect(0,0,cv.width,cv.height); g.setTransform(scale,0,0,scale,ox,oy); g.save(); g.beginPath(); g.rect(view.x,view.y,view.w,view.h); g.clip(); scene.draw(g); g.restore();
  if(toast&&now<toast.until){ const cx=view.x+view.w/2, by=view.y+view.h; g.fillStyle='rgba(10,11,14,.85)'; g.fillRect(cx-330,by-52,660,34); label(g,cx,by-30,toast.t,15); }
  if(scene.fade>0){ g.fillStyle=`rgba(0,0,0,${Math.min(1,scene.fade)})`; g.fillRect(view.x-50,view.y-50,view.w+100,view.h+100); }
  requestAnimationFrame(frame); }
document.getElementById('skip').addEventListener('click',e=>{ e.currentTarget.blur(); if(scene) scene.skipChapter(); });
load(); requestAnimationFrame(frame);
</script>

<!doctype html>
<!--
  Template for public/progress.html. Rendered by tools/progress/build-progress.mjs,
  which substitutes every double-brace placeholder below and nothing else. Keep it
  self-contained:
  no CDN, no external font, no script — this page is opened from a clone, from a
  phone on hotel wifi, and from a headless browser in a critic round.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>After Dark — gauntlet progress</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a21; --panel-2:#1b212a; --line:#272e3a;
    --ink:#e6e9ef; --ink-dim:#9aa3b2; --ink-faint:#6d7686;
    --accent:#ffb347;                     /* the prototype's orange */
    --pass:#4ccf7e; --fail:#ff6b6b; --pending:#e3b341; --na:#5b6473;
    --voxxy:#ff8a2b; --droid:#6fcf97; --biggy:#5aa9ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
  a{color:var(--accent)}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  h2{font-size:13px;margin:32px 0 12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);
     font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px}
  .sub{color:var(--ink-dim);font-size:13px;margin:4px 0 0}

  /* ---- header / countdown ---- */
  header{display:flex;gap:20px;align-items:center;flex-wrap:wrap;
         background:linear-gradient(180deg,var(--panel-2),var(--panel));
         border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .clock{display:flex;align-items:baseline;gap:10px;margin-left:auto}
  .clock .n{font-size:44px;font-weight:700;line-height:1;color:var(--accent);
            font-variant-numeric:tabular-nums}
  .clock .u{font-size:13px;color:var(--ink-dim);max-width:210px}
  .clock.late .n{color:var(--fail)}

  /* ---- summary chips ---- */
  .summary{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;
        padding:6px 12px;font-size:12.5px;color:var(--ink-dim)}
  .stat b{color:var(--ink);font-weight:600}

  /* ---- piece cards ---- */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .piece{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
         display:flex;flex-direction:column;gap:10px}
  .piece.first-class{border-color:#4a3a1c;box-shadow:inset 0 0 0 1px #2a2110}
  .piece h3{margin:0;font-size:15.5px;font-weight:650;line-height:1.3}
  .rubric{font-size:12.5px;color:var(--ink-dim)}
  .rubric .pts{color:var(--accent);font-weight:600}
  .verdict{background:var(--panel-2);border-left:2px solid var(--line);border-radius:0 6px 6px 0;
           padding:8px 10px;font-size:13px;color:var(--ink)}
  .verdict.none{color:var(--ink-faint);font-style:italic}
  .verdict time{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-faint);font-style:normal}
  .note{font-size:12.5px;color:var(--ink-dim);margin:0}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

  /* ---- chips ---- */
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
        font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .chip.pass{color:var(--pass);border-color:#265c3c;background:#11241a}
  .chip.fail{color:var(--fail);border-color:#5c2626;background:#241313}
  .chip.pending{color:var(--pending);border-color:#5c4a1c;background:#241f10}
  .chip.na{color:var(--na);border-color:#2b323d;background:#141920}
  .chip.rounds{color:var(--ink-dim);border-color:var(--line);background:var(--panel-2);font-weight:500}
  .chip.status-done{color:var(--pass);border-color:#265c3c;background:#11241a}
  .chip.status-building{color:var(--accent);border-color:#5c4a1c;background:#241f10}
  .chip.status-gauntlet{color:var(--biggy);border-color:#20406a;background:#101c2a}
  .chip.status-capped{color:var(--fail);border-color:#5c2626;background:#241313}
  .chip.status-todo{color:var(--na);border-color:#2b323d;background:#141920}

  /* ---- screenshots ---- */
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .shot{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;
        background:var(--panel-2);text-decoration:none}
  .shot img{display:block;width:100%;height:96px;object-fit:cover;background:#0a0c10}
  .shot .cap{display:block;padding:5px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
             color:var(--ink-dim)}
  .shot.empty{border-style:dashed}
  .shot.empty .cap{color:var(--ink-faint)}
  .shot.empty .ph{height:96px;display:flex;align-items:center;justify-content:center;
                  color:var(--ink-faint);font-size:11.5px;text-align:center;padding:0 8px}

  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--ink-faint);font-size:12px}

  @media (max-width:560px){
    .clock{margin-left:0;width:100%}
    .clock .n{font-size:38px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>After Dark — gauntlet progress</h1>
      <p class="sub">{{PROJECT_SUB}}</p>
    </div>
    <div class="clock {{CLOCK_CLASS}}">
      <span class="n">{{DAYS_NUM}}</span>
      <span class="u">{{DAYS_UNIT}}</span>
    </div>
  </header>

  <div class="summary">{{SUMMARY}}</div>

  {{SECTIONS}}

  <footer>{{FOOTER}}</footer>

</div>
</body>
</html>
